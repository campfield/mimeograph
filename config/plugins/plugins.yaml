---
#
# config/plugins/plugins.yaml
#
# Manages Vagrant plugin ensure state.
#
# Each entry specifies a plugin name and its desired state.
#
#   ensure: present  - ensure the plugin is installed; install if missing (default)
#   ensure: absent   - ensure the plugin is removed; uninstall if present
#   ensure: ignore   - take no action regardless of current installed state
#
# Optionally pin a specific version with the 'version' key.  Omit for latest.
#
# Note: changing 'version' will not auto-update an already-installed plugin.
# To change versions: set ensure to absent, run vagrant, then set the new
# version and set ensure back to present.
#
# Plugin integration code
# -----------------------
# mimeograph-side code for a plugin lives in code/plugins/<plugin-name>/ (the
# directory name must match the plugin name).  It is loaded only when the
# plugin is ensure: present here, the directory exists, and Vagrant reports
# the plugin as installed.  Plugins without a directory are simply installed
# or removed.
#
# An optional 'settings' hash is passed to that code.  The accepted keys are
# documented in the plugin's code/plugins/<plugin-name>/hooks.rb.
#
plugins:
  vagrant-vbguest:
    ensure: absent
    # version: '0.29.0'
  vagrant-hostmanager:
    ensure: absent
  vagrant-cachier:
    ensure: absent
  vagrant-aws:
    ensure: absent
  vagrant-dns:
    ensure: present
    settings:
      # Forward non-matching queries upstream: true | false | unknown
      passthrough: true
      # false sends the daemon's stdout/stderr to /dev/null instead of
      # ~/.vagrant.d/tmp/dns/daemon/vagrant-dns.output (which grows forever).
      daemon_output: false
      # Daemon log threshold: debug | info | warn | error | fatal (quietest)
      log_level: fatal
      # true answers every AAAA (IPv6) query with "no IPv6 address" locally,
      # instead of forwarding it upstream.  vagrant-dns only serves A records.
      block_aaaa: true
  vagrant-list:
    ensure: absent
  vagrant-nuke:
    ensure: absent
  vagrant-persistent-storage:
    ensure: ignore
  vagrant-libvirt:
    ensure: present
  vagrant-vmware_workstation:
    ensure: absent
  vagrant-vmware_desktop:
    ensure: absent
  vagrant-multi-hostsupdater:
    ensure: absent
  vagrant-vmware-esxi:
    ensure: present