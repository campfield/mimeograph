#---
##
## config/profiles/example_libvirt.yaml
##
## A small Rocky Linux 9.8 VM on libvirt/KVM that exercises the libvirt
## provider's options, with the console viewer on so its boot is shown in a
## window.  Group defaults (every option, documented):
## config/defaults/example_libvirt.yaml
##
##   vagrant up example-libvirt-rocky9      # a virt-viewer window opens on its console
##   vagrant ssh example-libvirt-rocky9
##   vagrant destroy -f example-libvirt-rocky9
##
## Over SSH to this host, the window opens on your desktop only with X
## forwarding (ssh -X, or ForwardX11 in ~/.ssh/config); otherwise 'vagrant up'
## prints the virt-viewer command to run on your desktop instead.
##
## The VM also appears in virt-manager and Cockpit (cockpit-machines) like any
## libvirt VM, as <project-directory>_example-libvirt-rocky9.
##
